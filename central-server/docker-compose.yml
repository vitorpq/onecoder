services:
  litellm-db:
    image: postgres:16-alpine
    container_name: onecoder-litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: onecoder-litellm
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm}@litellm-db:5432/${POSTGRES_DB:-litellm}"
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  onecoder-control-api:
    build:
      context: ./onecoder-control-api
    container_name: onecoder-control-api
    restart: unless-stopped
    depends_on:
      - litellm
    ports:
      - "${CONTROL_API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      CONTROL_API_PORT: "8080"
      LITELLM_INTERNAL_URL: "http://litellm:4000"
      AUDIT_LOG_PATH: "/data/audit.log"
    volumes:
      - control_api_data:/data

volumes:
  litellm_postgres_data:
  control_api_data:
